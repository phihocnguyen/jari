# =========================================================
# Indexer pipeline: đồng bộ dữ liệu từ PostgreSQL vào Elasticsearch
# để các truy vấn search/filter không phải query DB trực tiếp.
#
# - Poll mỗi 30s, chỉ lấy bản ghi có updated_at mới hơn lần chạy trước
#   (incremental sync qua :sql_last_value).
# - Dữ liệu được denormalize sẵn (join project/status/priority/user/sprint)
#   nên query từ Kibana/app không cần join nữa.
# - document_id = id bản ghi trong DB nên cập nhật là idempotent.
#
# Lưu ý: pipeline này không xử lý DELETE (bản ghi xoá cứng trong DB sẽ
# còn sót trong ES). Schema hiện tại xoá bằng soft-delete/cascade, nếu cần
# xoá đồng bộ hãy dùng script schedulera chạy `DELETE BY QUERY`.
# =========================================================

# ---------- ISSUES ----------
input {
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/logstash-core/lib/jars/postgresql-42.7.4.jar"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_connection_string => "${JDBC_URL}"
    jdbc_user => "${JDBC_USER}"
    jdbc_password => "${JDBC_PASSWORD}"
    schedule => "*/30 * * * * *"
    tracking_column => "updated_at"
    tracking_column_type => "timestamp"
    use_column_value => true
    last_run_metadata_path => "/usr/share/logstash/data/.jari_issues_last_run"
    add_field => { "[index_type]" => "issue" }
    statement => "
      SELECT i.id::text AS id,
             i.issue_key, lower(i.issue_key) AS issue_key_lower,
             i.title, lower(i.title) AS title_lower,
             i.description,
             i.story_points, i.position, i.due_date, i.start_date,
             i.created_at, i.updated_at,
             i.issue_type_id::text AS issue_type_id, it.name AS issue_type,
             i.status_id::text AS status_id,
             s.name AS status, s.category AS status_category,
             i.priority_id::text AS priority_id, p.name AS priority,
             i.release_id::text AS release_id,
             i.reporter_id::text AS reporter_id,
             i.assignee_id::text AS assignee_id,
             pr.id::text AS project_id, pr.name AS project_name, pr.project_key,
             w.id::text AS workspace_id, w.name AS workspace_name,
             r.username AS reporter_username, r.display_name AS reporter_name,
             a.username AS assignee_username, a.display_name AS assignee_name,
             spr.sprint_names AS sprint_names, spr.sprint_ids AS sprint_ids
      FROM issues i
      JOIN issue_types it ON it.id = i.issue_type_id
      JOIN statuses s     ON s.id = i.status_id
      JOIN priorities p   ON p.id = i.priority_id
      JOIN projects pr    ON pr.id = i.project_id
      JOIN workspaces w   ON w.id = pr.workspace_id
      JOIN users r        ON r.id = i.reporter_id
      LEFT JOIN users a   ON a.id = i.assignee_id
      LEFT JOIN LATERAL (
        SELECT string_agg(sp.name, ', ') AS sprint_names,
               string_agg(si.sprint_id::text, ',') AS sprint_ids
        FROM sprint_issues si
        JOIN sprints sp ON sp.id = si.sprint_id
        WHERE si.issue_id = i.id
      ) spr ON true
      WHERE i.updated_at > :sql_last_value
      ORDER BY i.updated_at
    "
  }

  # ---------- PROJECTS ----------
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/logstash-core/lib/jars/postgresql-42.7.4.jar"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_connection_string => "${JDBC_URL}"
    jdbc_user => "${JDBC_USER}"
    jdbc_password => "${JDBC_PASSWORD}"
    schedule => "*/60 * * * * *"
    tracking_column => "updated_at"
    tracking_column_type => "timestamp"
    use_column_value => true
    last_run_metadata_path => "/usr/share/logstash/data/.jari_projects_last_run"
    add_field => { "[index_type]" => "project" }
    statement => "
      SELECT p.id::text AS id,
             p.name, p.project_key, p.description,
             p.project_type, p.status,
             p.avatar_icon, p.avatar_color,
             p.created_at, p.updated_at,
             w.id::text AS workspace_id, w.name AS workspace_name,
             u.username AS lead_username, u.display_name AS lead_name,
             (SELECT count(*) FROM project_members pm WHERE pm.project_id = p.id) AS member_count,
             (SELECT count(*) FROM issues i WHERE i.project_id = p.id) AS issue_count
      FROM projects p
      JOIN workspaces w ON w.id = p.workspace_id
      LEFT JOIN users u ON u.id = p.lead_id
      WHERE p.updated_at > :sql_last_value
      ORDER BY p.updated_at
    "
  }

  # ---------- USERS ----------
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/logstash-core/lib/jars/postgresql-42.7.4.jar"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_connection_string => "${JDBC_URL}"
    jdbc_user => "${JDBC_USER}"
    jdbc_password => "${JDBC_PASSWORD}"
    schedule => "*/60 * * * * *"
    tracking_column => "updated_at"
    tracking_column_type => "timestamp"
    use_column_value => true
    last_run_metadata_path => "/usr/share/logstash/data/.jari_users_last_run"
    add_field => { "[index_type]" => "user" }
    statement => "
      SELECT u.id::text AS id,
             u.username, u.email, u.display_name, u.avatar_url, u.status,
             u.created_at, u.updated_at
      FROM users u
      WHERE u.updated_at > :sql_last_value
      ORDER BY u.updated_at
    "
  }
}

filter {
  # Mutate các field dữ liệu DB; log events từ Filebeat không đi qua nhánh này
  if [index_type] == "issue" {
    # JDBC trả về NUMERIC/BigDecimal — ép về number để sort/aggregate trên ES được
    mutate {
      convert => { "story_points" => "float" "position" => "float" }
    }
    # string_agg trả về "id1,id2" — mutate split (Logstash 9: split filter dùng terminator, không phải separator)
    if [sprint_ids] and [sprint_ids] != "" {
      mutate {
        split => { "sprint_ids" => "," }
      }
    }
  }
}

output {
  # Dữ liệu DB index theo entity, _id = id bản ghi (cập nhật đè lên bản cũ)
  if [index_type] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "jari-%{index_type}s"
      document_id => "%{id}"
    }
  }
  # Log runtime từ Filebeat index theo ngày như trước
  else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "jari-logs-%{+YYYY.MM.dd}"
    }
  }
}
