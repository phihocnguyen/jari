spring:
  application:
    name: jari

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jari}
    username: ${DB_USER:jari}
    password: ${DB_PASS:jari}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
        format_sql: false
        default_batch_fetch_size: 50

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 300000
      cache-null-values: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2.0

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:1035483492902-leb1af842felsvrle675oejavgbbbh3p.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET: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}
            scope: openid,profile,email

app:
  security:
    # Set to true để bypass kiểm tra xác thực JWT (mọi API đều public). Đổi thành false để bật lại bảo mật.
    bypass: true
    # Set to true để kích hoạt luồng OAuth2 Google Login. Đổi thành true (và uncomment spring.security.oauth2 ở trên) để bật OAuth2.
    oauth2-enabled: true
  jwt:
    secret: ${JWT_SECRET:c2VjcmV0LWtleS1mb3ItamFyaS1qaXJhLWNsb25lLWFwcGxpY2F0aW9uLTIwMjY=}
    access-token-expiry: 900        # 15 minutes (seconds)
    refresh-token-expiry: 604800    # 7 days (seconds)
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  notifications:
    # Job nhắc hạn issue hằng ngày lúc 8h sáng (múi giờ Asia/Ho_Chi_Minh), due date <= hôm nay + 2 ngày
    due-soon-enabled: ${NOTIFICATIONS_DUE_SOON_ENABLED:true}
    due-soon-cron: "0 0 8 * * *"
    due-soon-zone: Asia/Ho_Chi_Minh

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
