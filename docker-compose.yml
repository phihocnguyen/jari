name: jari

services:
  postgres:
    image: postgres:16-alpine
    container_name: jari-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jari}
      POSTGRES_USER: ${POSTGRES_USER:-jari}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jari}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jari} -d ${POSTGRES_DB:-jari}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jari

  redis:
    image: redis:7-alpine
    container_name: jari-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - jari

  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: jari-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - jari

  # Expose host Spring Boot (:8080) for GitHub webhooks.
  # Requires free token: https://dashboard.ngrok.com/get-started/your-authtoken
  #   docker compose --profile tunnel up -d ngrok
  # Inspect URL: http://localhost:4040  or  docker compose logs -f ngrok
  ngrok:
    image: ngrok/ngrok:latest
    container_name: jari-ngrok
    restart: unless-stopped
    profiles:
      - tunnel
    command:
      - "http"
      - "--log=stdout"
      - "host.docker.internal:${NGROK_TARGET_PORT:-8080}"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "${NGROK_UI_PORT:-4040}:4040"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - jari

volumes:
  postgres-data:
  rabbitmq-data:

networks:
  jari:
    name: jari
    driver: bridge
