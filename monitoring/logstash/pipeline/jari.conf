input {
  beats {
    port => 5044
  }
}

filter {
  # Log của backend phải là JSON (xem logback-spring.xml trong README).
  # Filebeat đã parse JSON trước (json.keys_under_root) nên các field
  # level, logger_name, message... đã nằm ở root của event.
  if [level] {
    mutate {
      add_field => { "[service]" => "%{[service_name]}" }
      remove_field => ["service_name"]
    }
  }

  # Gắn metadata của container (tên container, image...) vào event
  if [container][name] {
    mutate {
      add_field => { "[k8s_like_source]" => "%{[container][name]}" }
    }
  }

  # Chỉ giữ field cần thiết để index gọn hơn (tuỳ chọn, comment lại nếu muốn giữ tất cả)
  # mutate { remove_field => ["agent", "ecs", "host", "input", "log"] }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "jari-logs-%{+YYYY.MM.dd}"
  }
  # In ra stdout để debug pipeline khi mới setup: `docker logs jari-logstash`
  # stdout { codec => rubydebug }
}
